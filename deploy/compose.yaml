name: rionlyu-blog

services:
  blog:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: "8080"
      CANONICAL_ORIGIN: https://rionlyu.dev
      CONTACT_PROVIDER: webhook
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:?Set CONTACT_WEBHOOK_URL in .env}
      CONTACT_WEBHOOK_TOKEN: ${CONTACT_WEBHOOK_TOKEN:-}
      CONTACT_DELIVERY_TIMEOUT: ${CONTACT_DELIVERY_TIMEOUT:-8s}
      CONTACT_RATE_LIMIT: ${CONTACT_RATE_LIMIT:-5}
      CONTACT_RATE_WINDOW: ${CONTACT_RATE_WINDOW:-1h}
      CSRF_SECRET: ${CSRF_SECRET:?Set CSRF_SECRET in .env}
      TRUSTED_PROXY_CIDRS: 172.30.0.3/32
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    networks:
      edge:
        ipv4_address: 172.30.0.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
    restart: unless-stopped
    depends_on:
      blog:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        ipv4_address: 172.30.0.3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
