# Root remains available with the installed public key; passwords and unused
# forwarding features are disabled. Mikrus maps its assigned public SSH port
# to the container's internal port 22, which must not be changed here.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
