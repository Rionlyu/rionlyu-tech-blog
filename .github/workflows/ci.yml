name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Build browser assets
        run: |
          npm ci
          npm run build:assets
          npm run check:assets
          git diff --exit-code -- web/assets/dist

      - name: Audit browser dependencies
        run: npm audit --audit-level=moderate

      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Scan dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build production binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/blog ./cmd/blog

      - name: Build containers
        run: |
          docker build --tag rionlyu-blog:ci .
          docker build --file deploy/Caddy.Dockerfile --tag rionlyu-caddy:ci .
          docker pull cloudflare/cloudflared:2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d

      - name: Validate Compose deployments
        env:
          ACME_EMAIL: ci@example.test
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder
          CONTACT_WEBHOOK_URL: https://contact.example.test/messages
          CSRF_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/mikrus/compose.yaml config --quiet

      - name: Scan application container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rionlyu-blog:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan edge container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rionlyu-caddy:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan tunnel container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudflare/cloudflared:2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH
